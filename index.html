<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Burning Activity Calendar – harmonized MODIS + VIIRS</title>
<meta name="description" content="Interactive burning-activity calendar for Türkiye and surroundings, 2000–2025: NASA FIRMS MODIS and VIIRS hotspots harmonized into one comparable series. NASA Space Apps Challenge 2026.">
<!-- AI/SI disclosure (NASA Space Apps 2026): the code of this page and of the helper scripts in tools/ was written with the help of AI tools (Claude by Anthropic, Gemini by Google). Data: NASA FIRMS and NASA GIBS. Details in README.md. -->
<meta name="theme-color" content="#14110f">
<link rel="stylesheet" href="libs/leaflet.css"><link rel="stylesheet" href="libs/leaflet-geoman.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
:root{--soot:#14110f;--glass:rgba(20,17,15,.86);--ash:#2a2420;--ash2:#372f2a;--line:rgba(243,236,228,.14);--bone:#f3ece4;--smoke:#b3a99e;--ember:#ff5a1f;--glow:#ffb347;--sky:#8fd3ff;
 --side:0px;--calh:0px;--ease:cubic-bezier(.2,.8,.2,1);
 --disp:'Barlow Condensed','Arial Narrow','Roboto Condensed','Inter Display',sans-serif;--body:Barlow,'Segoe UI',Inter,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--body)}
html,body{height:100%;overflow:hidden}
body{background:var(--soot);color:var(--bone);font-size:14px;line-height:1.45}
a{color:var(--sky)}
h1,h2,h3,h4{font-family:var(--disp);font-weight:700;letter-spacing:.005em;line-height:1.05}
button,select,input{background:rgba(243,236,228,.07);color:var(--bone);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:.82rem;transition:background .18s,border-color .18s,color .18s,transform .18s var(--ease)}
select option{background:var(--ash);color:var(--bone)}
input{width:74px}input[type=checkbox]{width:16px;height:16px;accent-color:var(--ember);flex:none}input[type=range]{padding:0;width:130px;accent-color:var(--ember);border:0;background:none}
button{cursor:pointer;font-weight:600}
button:hover{background:rgba(243,236,228,.14);border-color:rgba(243,236,228,.3)}
button:active{transform:scale(.97)}
button.on{background:var(--ember);border-color:var(--ember);color:#1b0b03}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
small,.mut{color:var(--smoke);font-size:.78rem;line-height:1.5}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.badge{font-variant-numeric:tabular-nums;font-size:.78rem;color:var(--bone)}
.big{font-family:var(--disp);font-size:1.9rem;font-weight:700;line-height:1}
li{margin:4px 0 4px 18px;font-size:.84rem}
code{font-size:.92em;background:rgba(243,236,228,.08);padding:0 4px;border-radius:4px}

/* map fills the screen; everything else floats on it */
#map{position:fixed;inset:0;z-index:0;background:#0b0a09}
body::before{content:'';position:fixed;inset:0 0 auto 0;height:130px;z-index:5;pointer-events:none;background:linear-gradient(rgba(8,6,5,.72),transparent)}
.glass{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);box-shadow:0 18px 50px -18px rgba(0,0,0,.75)}

#top{position:fixed;z-index:20;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 14px;pointer-events:none}
#top>*{pointer-events:auto}
#brand{display:flex;align-items:center;gap:10px;animation:drop .7s var(--ease) both}
#brand .mark{width:38px;height:38px;fill:var(--ember);filter:drop-shadow(0 0 14px rgba(255,90,31,.55))}
#brand h1{font-size:1.75rem;font-weight:800;text-shadow:0 2px 14px rgba(0,0,0,.6)}
#brand p{font-size:.8rem;color:var(--bone);opacity:.82;text-shadow:0 1px 8px rgba(0,0,0,.8)}
#stat{display:flex;gap:12px;align-items:center;padding:7px 14px;border-radius:999px;font-size:.8rem;white-space:nowrap;max-width:46vw;overflow:hidden;animation:drop .7s var(--ease) .08s both}
#stat #sum{color:var(--smoke);overflow:hidden;text-overflow:ellipsis}
#acts{display:flex;gap:8px;animation:drop .7s var(--ease) .14s both}
#acts button{display:flex;align-items:center;gap:7px;height:38px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
#acts button:hover{background:var(--ember);border-color:var(--ember);color:#1b0b03}
#acts .ic{width:17px;height:17px}
#lang{min-width:44px;justify-content:center;font-family:var(--disp);font-size:1rem}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}

#err{position:fixed;z-index:70;top:0;left:0;right:0;background:#7f1d1d;color:#fff;padding:10px 16px;display:none}
#hint{position:fixed;z-index:45;top:70px;left:50%;transform:translateX(-50%);width:min(620px,calc(100vw - 24px));padding:14px 16px;border-radius:14px;font-size:.86rem;animation:rise .6s var(--ease) .5s both}
#hint[hidden]{display:none}
#hint button{margin-top:10px;background:var(--ember);border-color:var(--ember);color:#1b0b03}

/* icon dock */
#dockw{position:fixed;z-index:35;left:12px;right:calc(var(--side) + 12px);bottom:calc(var(--calh) + 12px);display:flex;justify-content:center;pointer-events:none;transition:bottom .5s var(--ease),right .5s var(--ease)}
#dock{pointer-events:auto;display:flex;gap:2px;padding:5px;border-radius:17px;max-width:100%;overflow-x:auto;scrollbar-width:none;animation:rise .7s var(--ease) .2s both}
#dock::-webkit-scrollbar{display:none}
#dock>button{flex:none;width:72px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;border-radius:12px;font-size:.7rem;font-weight:500;color:var(--bone);padding:0 2px}
#dock>button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#dock>button:hover{background:rgba(243,236,228,.1);transform:translateY(-2px)}
#dock>button:hover .ic{color:var(--glow)}
#dock>button.on{background:var(--ember);color:#1b0b03}
#dock>button.on .ic{color:#1b0b03}
#dock i{flex:none;width:1px;margin:8px 4px;background:var(--line)}
#vmenu{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translate(-50%,8px);display:flex;gap:6px;padding:6px;border-radius:13px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,transform .3s var(--ease),visibility 0s .3s}
#vmenu.on{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,0);transition:opacity .2s,transform .3s var(--ease)}
#toast{position:fixed;z-index:50;left:50%;bottom:calc(var(--calh) + 88px);transform:translate(-50%,10px);padding:9px 16px;border-radius:999px;font-size:.84rem;opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--ease);max-width:calc(100vw - 24px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* side panel */
#side{position:fixed;z-index:30;top:76px;right:12px;bottom:12px;width:420px;max-width:calc(100vw - 24px);display:flex;flex-direction:column;border-radius:18px;overflow:hidden;transform:translateX(calc(100% + 24px));opacity:0;visibility:hidden;transition:transform .5s var(--ease),opacity .3s,visibility 0s .5s}
#side.open{transform:none;opacity:1;visibility:visible;transition:transform .5s var(--ease),opacity .3s}
#side.wide{width:min(780px,calc(100vw - 24px))}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.ph h2{font-size:1.65rem;font-weight:800}
.icb{flex:none;width:34px;height:34px;padding:0;display:grid;place-items:center;border-radius:50%}
.icb .ic{width:17px;height:17px}
.pb{flex:1;overflow-y:auto;padding:14px 16px 20px;scrollbar-width:thin;scrollbar-color:var(--ash2) transparent}
.pane{display:none}.pane.on{display:block;animation:paneIn .45s var(--ease) both}
@keyframes paneIn{from{opacity:0;transform:translateY(10px)}}
.pane h3{font-size:1.12rem;margin:18px 0 8px;color:var(--bone)}
.pane h3:first-child{margin-top:0}
.pane>p{font-size:.86rem;margin-bottom:10px;color:var(--bone)}
.pane label{font-size:.84rem}
.pane label.row{cursor:pointer;align-items:flex-start;flex-wrap:nowrap;gap:8px}
.grp{background:rgba(243,236,228,.045);border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.st{background:rgba(243,236,228,.045);border:1px solid var(--line);border-radius:13px;padding:10px 12px;min-width:0}
.st.w2{grid-column:1/-1}
.st small{display:block}
.st b{display:block;font-size:.95rem;font-weight:600;overflow-wrap:anywhere}
.st b.num{font-family:var(--disp);font-size:2.1rem;font-weight:800;line-height:1.05;color:var(--glow)}
.st .sub{color:var(--sky);font-size:.76rem}
.half{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}.half>div{min-width:0}
#side.wide .half{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
#p-meth>details>summary{display:none}
#al ul{list-style:none}#al li{margin:0;padding:8px 10px;border-radius:9px;border:1px solid transparent;transition:background .18s,border-color .18s}
#al li:hover{background:rgba(255,90,31,.14);border-color:rgba(255,90,31,.45)}
.dlb{display:grid;gap:8px}.dlb button{display:flex;align-items:center;gap:10px;justify-content:flex-start;padding:11px 12px;text-align:left}
.drawb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
details summary{cursor:pointer;font-weight:600}
details p{margin:8px 0;line-height:1.55;font-size:.84rem}
.val-imgs{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
#side.wide .val-imgs{grid-template-columns:1fr 1fr}
.val-imgs img{width:100%;border-radius:8px;border:1px solid var(--line);background:#fff;display:block;margin-top:4px}
.vtw{overflow-x:auto;margin:6px 0 4px}
table.vt{border-collapse:collapse;font-size:.8rem;width:100%;min-width:600px}
table.vt th,table.vt td{border:1px solid var(--line);padding:6px 8px;text-align:center}
table.vt thead th,table.vt th.rh{background:rgba(0,0,0,.35);color:var(--bone);font-weight:600;vertical-align:bottom}
table.vt th.rh{text-align:left}
table.vt td{font-variant-numeric:tabular-nums}
table.vt tr.used th.rh{border-left:3px solid var(--ember)}
table.vt small{display:block;font-weight:400;color:var(--smoke);font-size:.72rem;line-height:1.35}
.vbox h4{font-size:1.08rem;margin:16px 0 6px}
.vbox ul{margin:6px 0}.vbox p.cap{margin:6px 0}
details.vals{margin:6px 0}details.vals summary{color:var(--sky);font-size:.8rem;font-weight:500}
#ref{margin-top:12px;padding:10px 12px;border-left:3px solid var(--ember);background:rgba(255,90,31,.08);border-radius:0 9px 9px 0}
table.vt tr.exp th.rh,table.vt tr.exp td{color:var(--smoke)}
table.vt td.best{color:var(--glow);font-weight:600}
.note{margin:8px 0;padding:9px 11px;border-left:3px solid var(--sky);background:rgba(143,211,255,.07);border-radius:0 9px 9px 0;font-size:.82rem;line-height:1.55}
.note ul{margin:4px 0}
#tour{position:fixed;z-index:46;top:76px;left:58px;width:min(400px,calc(100vw - 24px));padding:14px 16px;border-radius:14px;font-size:.86rem;border-color:rgba(255,90,31,.55)}
#tour[hidden]{display:none}#tour b.step{font-family:var(--disp);color:var(--glow);font-size:1.05rem;display:block;margin-bottom:4px}
#tour .row{margin:10px 0 0;justify-content:flex-end}#tour #tnext{background:var(--ember);border-color:var(--ember);color:#1b0b03}
#acts #demo{background:var(--ember);border-color:var(--ember);color:#1b0b03;white-space:nowrap}
.trend{font-size:.8rem;color:var(--smoke);margin-top:4px}
#own{width:100%;font-size:.78rem}

/* calendar drawer */
#cald{position:fixed;z-index:25;left:12px;right:calc(var(--side) + 12px);bottom:12px;height:0;display:flex;flex-direction:column;border-radius:18px;overflow:hidden;transform:translateY(calc(100% + 24px));opacity:0;visibility:hidden;transition:transform .5s var(--ease),opacity .3s,right .5s var(--ease),height .45s var(--ease),visibility 0s .5s}
#cald.open{transform:none;opacity:1;visibility:visible;transition:transform .5s var(--ease),opacity .3s,right .5s var(--ease),height .45s var(--ease)}
.dh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px 8px 16px}
.dh h2{font-size:1.45rem;font-weight:800;margin-right:4px}
.dh .seg{display:flex;gap:4px}
.dh .scale{display:flex;align-items:center;gap:6px}
.dh .sp{flex:1}
.lg{height:9px;width:150px;border-radius:5px;background:linear-gradient(90deg,#420a68 0%,#932667 25%,#dd513a 50%,#fca50a 75%,#fcffa4 100%)}
.lgw{position:relative;padding-bottom:13px}
.lz{display:inline-block;width:9px;height:9px;border-radius:2px;background:#211c19;border:1px solid #6f665e}
.lt{position:absolute;left:0;right:0;top:11px;height:11px;font-size:9px;line-height:11px;color:#a89d92;pointer-events:none}
.lt span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.lt span.e0{transform:none}.lt span.e1{transform:translateX(-100%)}
.mlg{background:rgba(20,17,15,.78);color:var(--bone);padding:6px 10px 4px;border-radius:9px;font-size:11px;line-height:1.3;border:1px solid rgba(243,236,228,.18)}
.mlg[hidden]{display:none}.mlg small{display:block;margin-bottom:5px}
.mlg .lg{width:170px}
#cald.full #cex .ic{transform:rotate(180deg)}
#cex .ic{transition:transform .4s var(--ease)}
.dsub{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 16px 8px;min-height:30px}
.dsub #mi{color:var(--bone)}.dsub #mclr{padding:3px 10px;border-radius:999px;border-color:var(--ember);color:var(--glow)}
#cinfo{flex:1;min-width:200px;font-size:.82rem;color:var(--smoke)}
#cinfo b{color:var(--glow);font-weight:600}#cinfo span{color:var(--smoke)}
.db{flex:1;overflow:auto;padding:0 12px 10px 8px;scrollbar-width:thin;scrollbar-color:var(--ash2) transparent}
#cal.ignite{animation:sweep 1.5s var(--ease) both}
@keyframes sweep{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
table.cal{border-collapse:separate;border-spacing:1px;font-size:10px;width:100%;min-width:700px;table-layout:fixed}
table.cal th:first-child{width:62px;text-align:right;padding-right:6px}
table.cal td{height:12px;text-align:center;cursor:pointer;border-radius:2px;line-height:12px;transition:transform .12s}
#cal[data-v=m] table.cal{min-width:520px}#cal[data-v=m] td{height:16px;line-height:16px;font-size:10px}
table.cal td:hover{transform:scale(1.35);position:relative;z-index:1;box-shadow:0 0 0 1.5px #fff}
table.cal td.sel{box-shadow:0 0 0 2px #fff,0 0 12px 3px var(--ember);position:relative;z-index:2}
table.cal th{font-weight:600;color:var(--smoke);white-space:nowrap;overflow:hidden}
table.cal tr:first-child th{position:sticky;top:0;z-index:3;background:#1a1613;height:17px;border-radius:2px}
table.cal th.cr{background:#7a2a0b!important;color:#ffe2d2;box-shadow:inset 0 -3px var(--ember)}
table.cal th.co{background:var(--ember)!important;color:#1b0b03;box-shadow:inset 0 -3px #fff}
.a1{outline:1.5px dashed #fff;outline-offset:-1.5px}.a2{outline:2px solid #fff;outline-offset:-2px}
.a3{outline:2px solid #fff;outline-offset:-2px;box-shadow:inset 0 0 0 4px #000}.a3::after{content:'★';font-size:8px}
.lgd{display:block;padding:8px 8px 0}

/* loader */
#load{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(10,8,7,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);transition:opacity .6s,visibility 0s .6s}
#load.done{opacity:0;visibility:hidden;pointer-events:none}
.lbox{display:grid;justify-items:center;gap:8px;text-align:center;padding:20px}
.lbox svg{width:54px;height:54px;fill:var(--ember);animation:flick 1.4s ease-in-out infinite}
.lbox b{font-family:var(--disp);font-size:2.4rem;font-weight:800;line-height:1}
.lbox span{color:var(--smoke)}
.lbox i{width:220px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--ember),var(--glow),transparent);background-size:200% 100%;animation:run 1.2s linear infinite}
@keyframes flick{50%{transform:scale(1.08) rotate(-3deg);filter:drop-shadow(0 0 18px var(--ember))}}
@keyframes run{to{background-position:-200% 0}}

/* view modes */
body.maxed #side,body.maxed #cald,body.maxed #stat,body.maxed #hint{opacity:0!important;visibility:hidden!important;pointer-events:none}

/* Leaflet, restyled to match */
.leaflet-container{font-family:var(--body);background:#0b0a09}
.leaflet-top.leaflet-left{top:74px;left:4px}
.leaflet-bottom{bottom:var(--calh);transition:bottom .5s var(--ease)}
.leaflet-right{right:var(--side);transition:right .5s var(--ease)}
.leaflet-bar{border:1px solid var(--line)!important;border-radius:11px!important;overflow:hidden;box-shadow:0 10px 30px -12px rgba(0,0,0,.8)!important}
.leaflet-bar a,.leaflet-pm-toolbar .leaflet-buttons-control-button{background:var(--glass)!important;color:var(--bone)!important;border-bottom:1px solid var(--line)!important}
.leaflet-bar a:hover,.leaflet-pm-toolbar .leaflet-buttons-control-button:hover{background:var(--ash2)!important}
.leaflet-pm-toolbar .control-icon{filter:invert(1) brightness(1.6)}
.leaflet-pm-toolbar .button-container.active .leaflet-buttons-control-button{background:var(--ember)!important}
.leaflet-control-scale-line{background:rgba(20,17,15,.7);color:var(--bone);border-color:var(--bone);text-shadow:none}
.leaflet-control-attribution{background:rgba(20,17,15,.7)!important;color:var(--smoke)!important;font-size:10px;border-radius:8px 0 0 0}
.leaflet-control-attribution a{color:var(--bone)}
.leaflet-tooltip{background:var(--soot);color:var(--bone);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px -8px #000;font-variant-numeric:tabular-nums}
.leaflet-tooltip-top:before{border-top-color:var(--soot)}.leaflet-tooltip-bottom:before{border-bottom-color:var(--soot)}.leaflet-tooltip-left:before{border-left-color:var(--soot)}.leaflet-tooltip-right:before{border-right-color:var(--soot)}

@media(max-width:1100px){#stat #sum{display:none}}
@media(max-width:760px){
 #top{padding:8px 10px}#brand .mark{width:30px;height:30px}#brand h1{font-size:1.3rem}#brand p,#stat,#fmb span{display:none}
 #fmb{width:38px;justify-content:center;padding:0}
 .leaflet-top.leaflet-left{top:54px}
 #dockw{left:8px;right:8px;bottom:8px}
 #dock{width:100%;gap:0}#dock i{display:none}
 #dock>button{flex:1;width:auto;min-width:0;height:46px}#dock>button span{display:none}
 .leaflet-control-attribution{max-width:58vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .leaflet-control-scale{margin-bottom:4px!important}
 #cald{left:8px;right:8px;bottom:68px}
 #side{top:58px;left:8px;right:8px;bottom:68px;width:auto;max-width:none;transform:translateY(calc(100% + 80px))}
 #side.wide{width:auto}#side.wide .half,#side.wide .val-imgs{grid-template-columns:1fr}
 .leaflet-bottom{bottom:calc(var(--calh) + 60px)}
 #toast{bottom:calc(var(--calh) + 74px)}
 .dh h2{font-size:1.2rem}.dh .scale{display:none}
 #hint{top:56px}
 #tour{left:8px;top:58px;width:calc(100vw - 16px)}#acts #demo span{font-size:.75rem}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style></head>

tips:['<ul><li>The bar at the bottom opens every tool: area, data and layers, calendar, insights, unusual weeks, method, download, share and view.</li><li>Zoom in as far as street level. Past zoom 9 the cells become outlines so the satellite image stays visible.</li><li>Click a calendar cell to map that week. Its note (value, z-score, MODIS-scaling caveat) appears above the calendar, so it also works on touch screens.</li><li>"Share" copies a link that restores the area, years and settings.</li></ul>','<ul><li>Alttaki çubuk tüm araçları açar: alan, veri ve katmanlar, takvim, özet, olağandışı haftalar, yöntem, indirme, paylaşma ve görünüm.</li><li>Sokak düzeyine kadar yakınlaşabilirsiniz. 9. yakınlık düzeyinden sonra hücreler çerçeveye dönüşür, uydu görüntüsü görünür kalır.</li><li>Bir takvim hücresine tıklayınca o hafta haritada gösterilir. Notu (değer, z-skoru, MODIS ölçekleme uyarısı) takvimin üstünde belirir; dokunmatik ekranda da çalışır.</li><li>"Paylaş", alanı, yılları ve ayarları geri yükleyen bir bağlantı kopyalar.</li></ul>'],

ack:['<b>Acknowledgment &amp; Disclaimer:</b> We acknowledge the use of data and/or imagery from NASA\'s Fire Information for Resource Management System (FIRMS) (<a href="https://earthdata.nasa.gov/firms" target="_blank" rel="noopener" style="color:#93c5fd">earthdata.nasa.gov/firms</a>), part of NASA\'s Land, Atmosphere Near real-time Capability for Earth observations (LANCE) and NASA\'s Earth Science Data and Information System (ESDIS). External links to the official NASA FIRMS Live Map open an external NASA website. We also acknowledge the use of imagery provided by services from NASA\'s Global Imagery Browse Services (GIBS), part of NASA\'s Earth Science Data and Information System (ESDIS) (<a href="https://earthdata.nasa.gov/gibs" target="_blank" rel="noopener" style="color:#93c5fd">earthdata.nasa.gov/gibs</a>). Satellite background: Esri, Maxar, Earthstar Geographics. <b>AI/SI disclosure:</b> the code of this app and of its helper scripts was written with the help of AI tools (Claude by Anthropic, Gemini by Google); details are in the README. This independent NASA Space Apps Challenge student project is not officially endorsed, sponsored, or partnered with NASA.','<b>Teşekkür ve Yasal Uyarı:</b> NASA\'nın Dünya Gözlemleri İçin Kara ve Atmosfer Neredeyse Gerçek Zamanlı Kapasitesi (LANCE) ve Dünya Bilimi Veri ve Bilgi Sistemi (ESDIS) bünyesindeki Kaynak Yönetimi için Yangın Bilgi Sistemi (FIRMS) (<a href="https://earthdata.nasa.gov/firms" target="_blank" rel="noopener" style="color:#93c5fd">earthdata.nasa.gov/firms</a>) veri ve görüntülerinin kullanımını beyan ve teşekkür ederiz. Resmi NASA FIRMS Canlı Haritası bağlantıları harici bir NASA web sitesini açar. Ayrıca NASA\'nın Dünya Bilimi Veri ve Bilgi Sistemi (ESDIS) bünyesindeki Küresel Görüntü Tarama Hizmetleri (GIBS) (<a href="https://earthdata.nasa.gov/gibs" target="_blank" rel="noopener" style="color:#93c5fd">earthdata.nasa.gov/gibs</a>) tarafından sağlanan görüntülerin kullanımını beyan ederiz. Uydu arka planı: Esri, Maxar, Earthstar Geographics. <b>Yapay zekâ (SI) beyanı:</b> bu uygulamanın ve yardımcı betiklerin kodu yapay zekâ araçlarının (Anthropic Claude, Google Gemini) yardımıyla yazılmıştır; ayrıntılar README\'dedir. Bu bağımsız NASA Space Apps Challenge öğrenci projesi NASA tarafından resmi olarak onaylanmamış, desteklenmemiş veya ortaklık kurulmamıştır.'],

how:['<b>How to use:</b> open <b>Area</b> in the bar below to choose where (draw a rectangle, polygon or circle on the map, pick a preset, use 📍 My Location, or type coordinates; the geodesic area in km² is calculated automatically) → open <b>Layers</b> to choose the years, sensor mode and map background → read the <b>Calendar</b>: <b>brighter = more hotspots</b>; outlined cells = unusually active weeks. <b>Click any cell</b> to map its hotspots over that week\'s NASA satellite image, or open the area in live NASA FIRMS.','<b>Nasıl kullanılır:</b> alttaki çubuktan <b>Alan</b>\'ı açıp yeri seçin (haritada dikdörtgen, çokgen veya daire çizin; hazır bölge seçin, 📍 Konumum\'u kullanın ya da koordinat girin; km² alanı otomatik hesaplanır) → <b>Katmanlar</b>\'ı açıp yılları, sensör modunu ve harita arka planını seçin → <b>Takvim</b>\'i okuyun: <b>parlak = daha çok sıcak nokta</b>; çerçeveli hücreler = olağandışı haftalar. Sıcak noktaları o haftanın NASA uydu görüntüsü üzerinde görmek için <b>herhangi bir hücreye tıklayın</b> veya alanı canlı NASA FIRMS haritasında açın.'],

vt_h:['Validation: does the MODIS→VIIRS scaling hold up over time?','Doğrulama: MODIS→VIIRS ölçeklemesi zaman içinde tutuyor mu?'],
vt_intro:['We scale MODIS counts to VIIRS-equivalent counts, predict the <b>monthly VIIRS totals of the whole region</b> and compare them with the real VIIRS. The table repeats this test with three different ways of splitting the years. All numbers are read from <code>data/validation_summary_v2.csv</code>.','MODIS sayılarını VIIRS eşdeğerine ölçekleyip <b>tüm bölgenin aylık VIIRS toplamlarını</b> tahmin ediyor ve gerçek VIIRS ile karşılaştırıyoruz. Tablo bu testi yılları bölmenin üç farklı yoluyla tekrarlar. Tüm sayılar <code>data/validation_summary_v2.csv</code> dosyasından okunur.'],
vt_corner:['Scaling factor','Ölçekleme faktörü'],
vs1:['① Fixed split<small>learn 2012–2018, test 2019–2025</small>','① Sabit bölme<small>2012–2018\'den öğren, 2019–2025\'te test et</small>'],
vs2:['② Expanding window<small>test each year 2015–2025, learn from all earlier years since 2012</small>','② İleriye genişleyen pencere<small>2015–2025\'in her yılını, 2012\'den o yıla kadarki yıllarla öğrenip test et</small>'],
vs3:['③ Leave one year out<small>each year 2012–2025 is held out in turn</small>','③ Her yılı sırayla dışarıda bırak<small>2012–2025\'in her yılı sırayla test edilir</small>'],
vt_f1:['Single factor<small>one ratio for all months</small>','Tek faktör<small>tüm aylar için tek oran</small>'],
vt_f2:['Monthly factor<small>one ratio per calendar month — the method used in the calendar</small>','Aylık faktör<small>her takvim ayı için ayrı oran — takvimde kullanılan yöntem</small>'],
vt_def:['<b>WAPE</b> = Σ|observed − predicted| ÷ Σ observed (lower is better). <b>Bias</b> = (Σ predicted − Σ observed) ÷ Σ observed; <b>positive means the predicted VIIRS is higher than the real VIIRS</b>. Both are computed on monthly totals of the whole region.','<b>WAPE</b> = Σ|gözlenen − tahmin| ÷ Σ gözlenen (düşük = iyi). <b>Bias</b> = (Σ tahmin − Σ gözlenen) ÷ Σ gözlenen; <b>pozitif, tahmin edilen VIIRS\'in gerçek VIIRS\'ten yüksek olduğu anlamına gelir</b>. İkisi de tüm bölgenin aylık toplamları üzerinden hesaplanır.'],
vt_foot:['The "~{n}%" shown when you hover over MODIS-scaled years in the calendar is the fixed-split monthly-factor WAPE (①).','Takvimde MODIS\'ten ölçeklenmiş yılların üzerine gelince görünen "~%{n}", sabit bölmedeki (①) aylık faktör WAPE\'sidir.'],
vt_foot2:[' It is the largest of the three monthly-factor results, i.e. the most cautious one.',' Üç aylık faktör sonucunun en büyüğüdür, yani en temkinli olanıdır.'],
vt_n1:['<b>Learned vs. used factors:</b> in the fixed split (①) the factors were learned from 2012–2018 only. The final series — the calendar — uses factors learned from the whole 2012–2025 overlap.','<b>Öğrenilen ve kullanılan faktörler:</b> sabit bölmede (①) faktörler yalnızca 2012–2018\'den öğrenildi. Nihai seri — yani takvim — 2012–2025 örtüşmesinin tamamından öğrenilen faktörleri kullanır.'],
vt_n2:['<b>The test only looks forward:</b> ① and ② learn from earlier years and predict later ones; ③ also learns from later years, so it is the most optimistic. Applying the factors <i>backward</i> to 2000–2011 cannot be tested, because there is no VIIRS record for those years.','<b>Test yalnızca ileriye doğrudur:</b> ① ve ② önceki yıllardan öğrenip sonraki yılları tahmin eder; ③ sonraki yılları da öğrenmeye kattığı için en iyimser olandır. Faktörleri <i>geriye</i>, 2000–2011\'e uygulamak test edilemez; çünkü bu yıllar için VIIRS kaydı yoktur.'],
vt_n3:['<b>Bias is positive</b> in the fixed split (①): the predicted VIIRS is higher than the real VIIRS. It is smaller in ② and ③ because their training years also include recent years. The chart below shows why it appears in the first place.','<b>Bias pozitiftir</b> (sabit bölme ①): tahmin edilen VIIRS gerçek VIIRS\'ten yüksektir. ② ve ③\'te eğitim yılları yakın yılları da içerdiği için daha küçüktür. Neden ortaya çıktığını aşağıdaki grafik gösterir.'],
vt_n3b:['<b>Bias is positive</b> in the fixed split (①): the predicted VIIRS is higher than the real VIIRS. The chart below shows why.','<b>Bias pozitiftir</b> (sabit bölme ①): tahmin edilen VIIRS gerçek VIIRS\'ten yüksektir. Nedenini aşağıdaki grafik gösterir.'],
vt_err:['Could not load <code>data/validation_summary_v2.csv</code> or <code>data/yearly_ratio_v2.csv</code>. Open the folder through a web server (e.g. "python -m http.server").','<code>data/validation_summary_v2.csv</code> veya <code>data/yearly_ratio_v2.csv</code> yüklenemedi. Klasörü bir web sunucusuyla açın (ör. "python -m http.server").'],
rc_h:['Why is the bias positive? Yearly VIIRS / MODIS ratio, 2012–2025','Bias neden pozitif? Yıllık VIIRS / MODIS oranı, 2012–2025'],
rc_la:['2012–2018 (training years in ①)','2012–2018 (① eğitim yılları)'],
rc_lb:['2019–2025 (test years in ①)','2019–2025 (① test yılları)'],
rc_y:['VIIRS detections per MODIS detection','MODIS tespiti başına VIIRS tespiti'],
rc_mean:['mean','ortalama'],rc_yr:['Year','Yıl'],
rc_c1:['Average yearly ratio: <b>{a}</b> in 2012–2018 vs. <b>{b}</b> in 2019–2025 ({d}). Single years vary a lot (2012–2018: {ar}; 2019–2025: {br}).','Yıllık oranın ortalaması: 2012–2018\'de <b>{a}</b>, 2019–2025\'te <b>{b}</b> ({d}). Tek tek yıllar arasında fark büyüktür (2012–2018: {ar}; 2019–2025: {br}).'],
rc_c2:[' <b>Why the bias is positive:</b> factors learned from 2012–2018 assume the higher ratio. In 2019–2025 one MODIS detection comes with fewer VIIRS detections than before, so the prediction made from MODIS ends up higher than the real VIIRS (bias {bt} with a single factor, {bm} with monthly factors, in ①). We tested <i>why</i> the ratio changed; the result is in the box below.',' <b>Bias neden pozitif:</b> 2012–2018\'den öğrenilen faktörler daha yüksek oranı varsayar. 2019–2025\'te bir MODIS tespitine düşen VIIRS tespiti öncekinden azdır; bu yüzden MODIS\'ten yapılan tahmin gerçek VIIRS\'ten yüksek çıkar (①\'de tek faktörle {bt}, aylık faktörle {bm}). Oranın <i>neden</i> değiştiğini test ettik; sonuç aşağıdaki kutuda.'],
rc_tab:['Show the yearly values as a table','Yıllık değerleri tablo olarak göster'],
sc1:['Value scaled from MODIS. Typical validation error for the region\'s monthly total: ~{n}%','MODIS\'ten ölçeklenmiş değer. Bölgenin aylık toplamı için doğrulamada tipik hata ~%{n}'],
sc2:['For a small area the error is higher (in our test on 1° squares it was more than twice as large; see README, Known limitations). A single week or day was not measured.','Küçük bir alanda hata daha yüksektir (1° karelerde yaptığımız testte iki kattan fazlaydı; bkz. README, Known limitations). Tek bir hafta veya gün ölçülmedi.'],
sc2a:['That error was measured for the whole region (Türkiye and surroundings), not for your selected area, where it may be higher.','Bu hata seçtiğiniz alan için değil, tüm bölge (Türkiye ve çevresi) için ölçüldü; seçtiğiniz alanda daha yüksek olabilir.'],
sc0:['2000–02: Terra only until 3 July 2002, so these values use their own Terra-only factors (held-out error about 25%, tested on 2019–2025). The real error for these years could not be measured.','2000–02: 3 Temmuz 2002\'ye kadar yalnızca Terra; bu değerlerde yalnız-Terra faktörleri kullanıldı (2019–2025 testinde hata yaklaşık %25). Bu yıllar için gerçek hata ölçülemedi.'],
sc1b:['Value scaled from MODIS.','MODIS\'ten ölçeklenmiş değer.'],
demo:['▶ Demo','▶ Demo'],t_close:['Close','Kapat'],t_back:['Back','Geri'],t_next:['Next','İleri'],t_done:['Finish','Bitir'],
tour1:['1/4 · The problem','1/4 · Sorun','MODIS (1 km pixels, since 2000) sees about <b>3.6× fewer</b> fires than VIIRS (375 m, since 2012). MODIS is reaching the end of its mission; without a bridge, the 2000–2011 record cannot be compared with today. The table shows how well our MODIS→VIIRS scaling predicts VIIRS in years it never saw.','MODIS (1 km piksel, 2000\'den beri) VIIRS\'e (375 m, 2012\'den beri) göre yaklaşık <b>3,6 kat daha az</b> yangın görür. MODIS görev ömrünün sonuna geliyor; bir köprü olmazsa 2000–2011 kaydı bugünle karşılaştırılamaz. Tablo, MODIS→VIIRS ölçeklememizin hiç görmediği yıllarda VIIRS\'i ne kadar iyi tahmin ettiğini gösterir.'],
tour2:['2/4 · Pick an area and a week','2/4 · Alan ve hafta seç','Case study: the <b>July–August 2021 megafires</b> (Manavgat, Marmaris, Milas). The calendar row 2021 lights up in weeks 30–31; the map shows only that week\'s hotspots over NASA\'s true-colour MODIS image of the same week.','Vaka analizi: <b>Temmuz–Ağustos 2021 megayangınları</b> (Manavgat, Marmaris, Milas). Takvimde 2021 satırı 30–31. haftalarda parlıyor; harita yalnızca o haftanın sıcak noktalarını aynı haftanın NASA gerçek renkli MODIS görüntüsü üzerinde gösterir.'],
tour3:['3/4 · Is this unusual?','3/4 · Bu olağandışı mı?','<b>This month vs. history</b> answers it in one sentence (percent of the median of all other years), <b>On this day</b> compares the same dates (±3 days) across 25 years, and the <b>trend</b> tile tests whether activity is rising (Theil–Sen + Mann–Kendall).','<b>Bu ay ve tarihsel medyan</b> bunu tek cümleyle yanıtlar (diğer tüm yılların medyanının yüzdesi), <b>Tarihte bu gün</b> aynı tarihleri (±3 gün) 25 yıl boyunca karşılaştırır, <b>trend</b> kutusu aktivitenin artıp artmadığını test eder (Theil–Sen + Mann–Kendall).'],
tour4:['4/4 · Take it to the field','4/4 · Sahaya götür','The <b>Unusual</b> list flags weeks to review; the <b>one-page report</b> button prints everything for a briefing. The method works for any region: load NASA FIRMS CSV files under <b>Layers</b>.','<b>Olağandışı</b> listesi incelenecek haftaları işaretler; <b>tek sayfalık rapor</b> düğmesi her şeyi brifing için yazdırır. Yöntem her bölgede çalışır: <b>Katmanlar</b> altından NASA FIRMS CSV dosyaları yükleyin.'],
mm_h:['Map shows','Harita gösterimi'],mm_sum:['Hotspot total','Sıcak nokta toplamı'],mm_freq:['Fire frequency (years)','Yangın sıklığı (yıl)'],
mm_n:['Fire frequency = in how many of the selected years a cell had at least one hotspot. Useful to see where fire comes back every year. (When a single week or month is selected, the map shows totals.)','Yangın sıklığı = seçili yılların kaçında bir hücrede en az bir sıcak nokta görüldüğü. Yangının her yıl geri geldiği yerleri gösterir. (Tek bir hafta veya ay seçiliyken harita toplamı gösterir.)'],
own_h:['Another region (your own FIRMS files)','Başka bölge (kendi FIRMS dosyalarınız)'],
own_p:['Download NASA FIRMS archive CSVs for any box (MODIS <code>MODIS_SP</code> and VIIRS <code>VIIRS_SNPP_SP</code>; select both files together). The app grids them to 0.25° with the same filters (type 0, MODIS confidence ≥ 30, VIIRS not low), learns its own monthly factors from that region\'s 2012+ overlap and builds the same calendar. Everything stays in your browser. The validation table and figures below describe the bundled Türkiye dataset only.','Herhangi bir kutu için NASA FIRMS arşiv CSV\'lerini indirin (MODIS <code>MODIS_SP</code> ve VIIRS <code>VIIRS_SNPP_SP</code>; iki dosyayı birlikte seçin). Uygulama onları aynı filtrelerle (type 0, MODIS güveni ≥ 30, VIIRS düşük değil) 0,25° ızgaraya çevirir, o bölgenin 2012+ örtüşmesinden kendi aylık faktörlerini öğrenir ve aynı takvimi kurar. Her şey tarayıcınızda kalır. Aşağıdaki doğrulama tablosu ve şekiller yalnızca paketteki Türkiye verisini anlatır.'],
k6:['Trend of yearly totals (from 2003)','Yıllık toplam trendi (2003\'ten)'],
rep_b:['🖨 One-page report for this area','🖨 Bu alan için tek sayfalık rapor'],d5:['One-page area report (print / save as PDF)','Tek sayfalık alan raporu (yazdır / PDF kaydet)'],
otd_h:['On this day (±3 days, every year)','Tarihte bu gün (±3 gün, her yıl)'],otd_n:['pick a date; the same window is counted in every year','bir tarih seçin; aynı pencere her yılda sayılır'],
ov_h:['Overlap check for the selected area: scaled MODIS vs. real VIIRS, 2012–2025','Seçili alan için örtüşme kontrolü: ölçeklenmiş MODIS ve gerçek VIIRS, 2012–2025'],
ov_intro:['If the scaling works, the two lines should lie on top of each other — the sensor should no longer matter. This chart is recomputed for whatever area you draw.','Ölçekleme çalışıyorsa iki çizgi üst üste binmelidir; yani sensör artık fark etmemelidir. Bu grafik çizdiğiniz her alan için yeniden hesaplanır.'],
alt_h:['Other harmonization methods we tested','Denediğimiz diğer uyumlaştırma yöntemleri'],
alt_intro:['The same three held-out schemes, applied to eight methods: from simpler (single factor) to more flexible (power law, regression, quantile mapping), spatial (sub-region and per-square factors) and machine learning (gradient boosting). <b>Region</b> = monthly totals of the whole box, <b>1° square</b> = monthly totals of ~110 × 85 km squares (closer to a drawn area). Read from <code>data/method_comparison_v2.csv</code> (<code>tools/compare_methods.py</code>).','Aynı üç dışarıda-tutma şeması sekiz yönteme uygulandı: daha basitinden (tek faktör) daha esneğine (üs yasası, regresyon, kantil eşleme), uzamsal yöntemlere (alt bölge ve kare bazlı faktörler) ve makine öğrenmesine (gradient boosting). <b>Bölge</b> = tüm kutunun aylık toplamları, <b>1° kare</b> = ~110 × 85 km karelerin aylık toplamları (çizilen alana daha yakın). <code>data/method_comparison_v2.csv</code> dosyasından okunur (<code>tools/compare_methods.py</code>).'],
am_single:['Single factor','Tek faktör'],am_monthly:['Monthly factor (used)','Aylık faktör (kullanılan)'],am_power_law:['Power law, regional totals','Üs yasası, bölge toplamları'],am_linear:['Linear regression','Doğrusal regresyon'],am_quantile_map:['Quantile mapping','Kantil eşleme'],am_subregion:['Monthly factor per sub-region (4)','Alt bölge başına aylık faktör (4)'],am_square_shrunk:['Monthly × per-square correction (shrunk)','Aylık × kare düzeltmesi (büzülmüş)'],am_gbm_poisson:['Gradient boosting (ML, Poisson)','Gradient boosting (ML, Poisson)'],am_us:['Power law: month coefficients + shared exponent (team experiment, not used)','Üs yasası: ay katsayıları + ortak üs (ekip denemesi, kullanılmıyor)'],
alt_lv:['Region','Bölge'],alt_sq:['1° square','1° kare'],
alt_n:['<b>Why we kept the monthly factor:</b><ul><li><b>Gradient boosting</b> is best on the whole region (WAPE {g1} / {g2} / {g3} vs. {m1} / {m2} / {m3}), but its bias changes sign between schemes ({gb1} … {gb3}) and in the forward test ① it is <i>worse</i> for 1° squares ({gs1} vs. {ms1}) — and small areas are what users draw. It also cannot be trained for the Terra-only years (the grid does not separate Terra and Aqua), and a non-linear monthly model does not add up from daily 0.25° cells, which the calendar needs. We use it as a <b>sensitivity check</b> instead (chart below).</li><li><b>Power law, regression and quantile mapping</b> fitted on regional totals are worse ({pl} / {li} / {qm} in ①) and non-additive: the value of an area would not equal the sum of its cells.</li><li><b>Spatial factors</b> (sub-regions, per-square correction) do not beat the monthly factor in the forward test ① ({sr} / {ss}): the spatial pattern of the ratio is not stable enough over time to be learned.</li><li><b>Not testable with the 0.25° grid:</b> day/night and fire-radiative-power classes need the raw FIRMS records (<code>daynight</code>, <code>frp</code>), which the grid does not keep.</li></ul>','<b>Neden aylık faktörde kaldık:</b><ul><li><b>Gradient boosting</b> tüm bölgede en iyisidir (WAPE {g1} / {g2} / {g3}, aylık faktörde {m1} / {m2} / {m3}); ancak biası şemalar arasında işaret değiştirir ({gb1} … {gb3}) ve ileriye dönük test ①\'de 1° karelerde <i>daha kötüdür</i> ({gs1}, aylıkta {ms1}) — kullanıcıların çizdiği de küçük alanlardır. Ayrıca yalnız-Terra yılları için eğitilemez (ızgara Terra ve Aqua\'yı ayırmaz) ve doğrusal olmayan aylık bir model, takvimin ihtiyaç duyduğu günlük 0,25° hücrelerden toplanarak aynı sonucu vermez. Bunun yerine onu bir <b>duyarlılık kontrolü</b> olarak kullanıyoruz (aşağıdaki grafik).</li><li>Bölge toplamlarına uydurulan <b>üs yasası, regresyon ve kantil eşleme</b> daha kötüdür (①\'de {pl} / {li} / {qm}) ve toplanabilir değildir: bir alanın değeri hücrelerinin toplamına eşit olmaz.</li><li><b>Uzamsal faktörler</b> (alt bölgeler, kare düzeltmesi) ileriye dönük test ①\'de aylık faktörü geçemez ({sr} / {ss}): oranın uzaydaki deseni zaman içinde öğrenilecek kadar kararlı değildir.</li><li><b>0,25° ızgarayla test edilemeyenler:</b> gece/gündüz ve yangın ışınım gücü (FRP) sınıfları ham FIRMS kayıtlarını (<code>daynight</code>, <code>frp</code>) gerektirir; ızgara bunları tutmaz.</li></ul>'],
gs_t:['Sensitivity check: yearly totals 2003–2011, monthly factor vs. gradient boosting','Duyarlılık kontrolü: 2003–2011 yıllık toplamları, aylık faktör ve gradient boosting'],
gs_c:['Gradient boosting trained on all of 2012–2025 and applied to the MODIS years gives yearly totals {lo} to {hi} different from the product (largest in the big fire years {big}); the two series correlate at <b>r = {r}</b> and rank the years almost identically (Spearman ρ = {rho}). Which years were high or low does not depend on the choice of method; only the size of the biggest peaks does. Read from <code>data/gbm_sensitivity_v2.csv</code> (<code>tools/gbm_sensitivity.py</code>).','2012–2025\'in tamamında eğitilip MODIS yıllarına uygulanan gradient boosting, yıllık toplamları üründen {lo} ile {hi} arasında farklı verir (en çok büyük yangın yıllarında: {big}); iki seri <b>r = {r}</b> ile ilişkilidir ve yılları neredeyse aynı sıralar (Spearman ρ = {rho}). Hangi yılların yüksek ya da düşük olduğu yöntem seçimine bağlı değildir; yalnızca en büyük tepelerin büyüklüğü değişir. <code>data/gbm_sensitivity_v2.csv</code> dosyasından okunur (<code>tools/gbm_sensitivity.py</code>).'],
fac_h:['The factors themselves: Terra + Aqua (from 4 July 2002) vs. Terra only (before)','Faktörlerin kendisi: Terra + Aqua (4 Temmuz 2002\'den itibaren) ve yalnız Terra (öncesi)'],
fac_c:['Terra-only factors are on average <b>{avg}×</b> the Terra + Aqua ones, because one satellite sees about half as many fires. They are noisy in winter (Jan {j}, Dec {d}) because few fires burn then (grey line: MODIS detections behind each factor, 2012–2025). The effect on the record is small: in 2001, Nov–Mar contribute only <b>{wsh}</b> of the year\'s {tot} hotspots, while Aug–Oct contribute <b>{ssh}</b> (raw Terra detections Sep {s9}, Oct {s10}, both higher than in 2003). The high 2001 total is therefore driven by the summer–autumn fire season, not by the winter factors; 2000–2002 are still marked ⚠ and excluded from the anomaly baseline (2003+).','Yalnız-Terra faktörleri ortalama Terra + Aqua faktörlerinin <b>{avg} katıdır</b>, çünkü tek uydu yaklaşık yarısı kadar yangın görür. Kışın gürültülüdür (Oca {j}, Ara {d}), çünkü o aylarda az yangın olur (gri çizgi: her faktörün arkasındaki MODIS tespit sayısı, 2012–2025). Kayda etkisi küçüktür: 2001\'de Kas–Mar ayları yılın {tot} sıcak noktasının yalnızca <b>{wsh}</b>\'ini oluştururken Ağu–Eki <b>{ssh}</b>\'ini oluşturur (ham Terra tespitleri Eyl {s9}, Eki {s10}; ikisi de 2003\'ten yüksek). Yani 2001\'in yüksek toplamı kış faktörlerinden değil yaz–sonbahar yangın sezonundan gelir; 2000–2002 yine de ⚠ ile işaretlidir ve anomali tabanının (2003+) dışındadır.'],
fac_l1:['Terra + Aqua','Terra + Aqua'],fac_l2:['Terra only','Yalnız Terra'],fac_l3:['MODIS detections 2012–2025','MODIS tespitleri 2012–2025'],fac_y:['VIIRS per MODIS detection','MODIS tespiti başına VIIRS'],
drf:['<b>Why did the ratio fall? What we tested</b> (<code>data/ratio_drift_v2.csv</code>, <code>tools/ratio_drift_check.py</code>; pooled ratio {pa} → {pb}, {dp}):<ul><li><b>Bigger fires?</b> Large fires saturate the 1 km MODIS pixel, so a year dominated by large fires has a lower ratio. But the share of VIIRS detections coming from large fire cell-days (≥ 10 VIIRS detections in a 0.25° cell in one day) did <i>not</i> rise ({sa} → {sb}), and the ratio fell mostly for <i>small</i> fires ({ra} → {rb}, {dr}; large fires {la} → {lb}, {dl}). So fire size is not the main cause — except in <b>2021</b>, the megafire year (large-fire share {s21}, ratio {r21}).</li><li><b>Different season mix?</b> More fires in months with a low ratio would lower the yearly ratio. The month mix explains only {dm} of the {dp} change.</li><li><b>Orbit drift (not testable here).</b> Terra and Aqua stopped their orbit-maintenance manoeuvres around 2020–2022, and their local overpass times have been drifting since; this changes how many fires MODIS sees. Testing it needs Terra and Aqua kept apart, which the grid does not do.</li></ul>So the drop is real, small-fire driven and only partly explained. It is why the forward test ① has a positive bias; the schemes that include recent years (②, ③) have a bias within ±2%.','<b>Oran neden düştü? Test ettiklerimiz</b> (<code>data/ratio_drift_v2.csv</code>, <code>tools/ratio_drift_check.py</code>; birleşik oran {pa} → {pb}, {dp}):<ul><li><b>Daha büyük yangınlar mı?</b> Büyük yangınlar 1 km\'lik MODIS pikselini doyurur, bu yüzden büyük yangınların baskın olduğu bir yılda oran düşer. Ancak VIIRS tespitlerinin büyük yangın hücre-günlerinden (bir günde 0,25° hücrede ≥ 10 VIIRS tespiti) gelen payı <i>artmadı</i> ({sa} → {sb}) ve oran en çok <i>küçük</i> yangınlarda düştü ({ra} → {rb}, {dr}; büyük yangınlarda {la} → {lb}, {dl}). Yani ana neden yangın büyüklüğü değil — megayangın yılı <b>2021</b> hariç (büyük yangın payı {s21}, oran {r21}).</li><li><b>Farklı mevsim karışımı mı?</b> Oranın düşük olduğu aylarda daha çok yangın olması yıllık oranı düşürür. Ay karışımı {dp} değişimin yalnızca {dm}\'sini açıklar.</li><li><b>Yörünge kayması (burada test edilemez).</b> Terra ve Aqua 2020–2022 civarında yörünge düzeltme manevralarını bıraktı ve yerel geçiş saatleri o zamandan beri kayıyor; bu, MODIS\'in kaç yangın gördüğünü değiştirir. Test etmek için Terra ve Aqua\'nın ayrı tutulması gerekir; ızgara bunu yapmaz.</li></ul>Yani düşüş gerçektir, küçük yangınlardan kaynaklanır ve yalnızca kısmen açıklanır. İleriye dönük test ①\'deki pozitif biasın nedeni budur; yakın yılları da içeren şemalarda (②, ③) bias ±%2 içindedir.'],
cont_h:['What happens when MODIS is switched off?','MODIS kapatılınca ne olacak?'],
cont:['<p>Terra and Aqua are near the end of their missions. Once the 2000–2011 MODIS record has been put on the VIIRS scale (this project), the calendar no longer needs MODIS: from 2012 it is pure VIIRS, so it continues with S-NPP and with the identical VIIRS instruments on NOAA-20 and NOAA-21 (also in FIRMS). Only the factors need MODIS and VIIRS flying together, and they are already learned from 14 overlap years. The same pipeline works for any region (see <b>Layers → Another region</b>).</p>','<p>Terra ve Aqua görev ömürlerinin sonuna yaklaştı. 2000–2011 MODIS kaydı bir kez VIIRS ölçeğine taşındıktan sonra (bu proje) takvimin MODIS\'e ihtiyacı kalmaz: 2012\'den itibaren yalnızca VIIRS\'tir; S-NPP ve NOAA-20, NOAA-21 üzerindeki özdeş VIIRS cihazlarıyla (FIRMS\'te mevcut) devam eder. Yalnızca faktörlerin öğrenilmesi MODIS ve VIIRS\'in birlikte uçmasını gerektirir ve bunlar 14 örtüşme yılından zaten öğrenildi. Aynı yöntem her bölgede çalışır (bkz. <b>Katmanlar → Başka bölge</b>).</p>'],
f1:['Harmonization: Before vs. After (2000–2025)','Uyumlaştırma: Öncesi ve Sonrası (2000–2025)'],
f2:['Calendar-Month Scaling Factors (VIIRS / MODIS)','Aylık Ölçekleme Çarpanları (VIIRS / MODIS)'],
f3:['Case Study: July–August 2021 Manavgat Megafire','Vaka Analizi: Temmuz–Ağustos 2021 Manavgat Yangını'],
f4:['Fixed-split test, scheme ① (learn 2012–2018, test 2019–2025): actual VIIRS vs. MODIS prediction','Sabit bölme testi, şema ① (2012–2018\'den öğren, 2019–2025\'te test et): gerçek VIIRS ve MODIS tahmini'],
mt:['<p><b>Harmonization:</b> MODIS (2000–2011) hotspot counts are scaled to VIIRS-equivalent counts with calendar-month factors (<code>monthly_factors_v2.json</code>) derived from the 2012–2025 overlap; from 2012 VIIRS is used as is. Grid: 0.25°, daily. Data: NASA FIRMS Area API, bounding box 25.5–44.9°E, 35.7–42.2°N (<b>Türkiye &amp; surroundings</b>).</p><p><b>Anomalies:</b> per calendar week over the selected years from 2003 (log counts). Team reference = mean/SD z-score (matches the Colab/JS validation); Robust = median/MAD. Results are candidates for review. Weeks are shown 1–52 (JS 0-based index = week − 1); week 52 covers the last 8–9 days of the year.</p><ul><li><b>Colab ↔ JS Validation:</b> The app reproduces the Python/Colab reference outputs with 0.0 difference: critical weeks <code>25–27, 32–42</code> (JS 0-based: <code>24–26, 31–41</code>), core weeks <code>34–40</code> (JS 0-based: <code>33–39</code>), <code>10</code> anomalies.</li><li><b>2000–02 Single-Satellite Era (⚠):</b> Only Terra MODIS was active until 3 July 2002 (when Aqua joined, doubling daily overpasses). The values before that date use their own Terra-only monthly factors (<code>monthly_factors_terra_v2.json</code>).</li><li><b>Recurrent Cells &amp; FIRMS Type Check:</b> Toggling "Exclude recurrent-hotspot cells" filters out persistent cells active ≥150 days in ≥12 of 14 years (493 cells), isolating repeated agricultural stubble burning and static industrial sources.</li><li><b>2009 &amp; Spring 2012 Independent Verification:</b> Raw Terra and Aqua records independently confirm the 2009 activity jump across both day and night overpasses (99.5% <code>type=0</code> vegetation fire). Spring 2012 is also elevated in both MODIS and VIIRS with normal inter-sensor ratios.</li></ul>','<p><b>Uyumlaştırma:</b> MODIS (2000–2011) sayıları, 2012–2025 örtüşmesinden türetilen aylık çarpanlarla (<code>monthly_factors_v2.json</code>) VIIRS eşdeğerine ölçeklenir; 2012\'den itibaren VIIRS olduğu gibi kullanılır. Izgara: 0,25°, günlük. Veri: NASA FIRMS Area API, dikdörtgen kutu 25,5–44,9°D, 35,7–42,2°K (<b>Türkiye ve çevresi</b>).</p><p><b>Anomali:</b> seçili yıllarda (2003 ve sonrası) her takvim haftası için log sayım üzerinden hesaplanır. Ekip referansı = ortalama/SS z-skoru (Colab/JS doğrulamasıyla birebir aynı); Dayanıklı = medyan/MAD. Sonuçlar inceleme adaylarıdır. Haftalar 1–52 gösterilir (JS 0-tabanlı indeksi = hafta − 1); 52. hafta yılın son 8–9 gününü kapsar.</p><ul><li><b>Colab ↔ JS Doğrulaması:</b> Uygulama, Python/Colab referans sonuçlarıyla %100 örtüşmektedir: kritik haftalar <code>25–27, 32–42</code> (JS 0-tabanlı: <code>24–26, 31–41</code>), çekirdek haftalar <code>34–40</code> (JS 0-tabanlı: <code>33–39</code>), <code>10</code> anomali.</li><li><b>2000–02 Tek Uydu Dönemi (⚠):</b> 3 Temmuz 2002\'ye kadar yalnızca Terra MODIS aktifti (Aqua uydusu katılarak günlük geçiş sayısını ikiye katladı). Bu tarihten önceki değerler kendi yalnız-Terra aylık faktörlerini kullanır (<code>monthly_factors_terra_v2.json</code>).</li><li><b>Tekrarlayan Hücreler ve FIRMS Tür Kontrolü:</b> "Tekrarlayan hücreleri hariç tut" seçeneği 14 yılın ≥12\'sinde ≥150 gün aktif olan hücreleri (493 hücre) filtreleyerek sabit sanayi kaynaklarını ve tekrarlı anız yakmalarını ayırır.</li><li><b>2009 ve 2012 İlkbaharı Bağımsız Doğrulaması:</b> Ham Terra ve Aqua kayıtları, 2009 yılındaki sıçramayı gündüz ve gece geçişlerinde bağımsız olarak doğrulamaktadır (%99,5\'i <code>type=0</code> bitki örtüsü yangını). 2012 ilkbaharı da hem MODIS hem VIIRS\'te normal sensör oranlarıyla yüksektir.</li></ul>']};
let LANG='en',METH='c',REF=null,AOI=null,AOIL='',SHAPE=null,SENS='intensity',VIEW='w',FOCUS=null,N=0,F={},CUR=null,SEL,GRAT=null,DB=[25.5,35.5,45.0,42.25];
const l=(a,b)=>LANG=='tr'?b:a,t=k=>T[k][LANG=='tr'?1:0],SK=['intensity','raw_modis','raw_viirs'];
let D,K,Y,W,M,LA,LO,ST,NST=0,V={};
let VAL=null,YR=null,VERR=0,VSIG='';
let FT={},ALT=null,GS=null,DR=null,MAPM='sum',OWN=false,TSTEP=-1,DN,FR1={},MC12=new Float64Array(12),FSTAT=null,OVS=null;
const RP=[[66,10,104],[147,38,103],[221,81,58],[252,165,10],[252,255,164]];
// Colour scale (calendar and map): log1p between the 5th and the 98th percentile of the non-zero values in view
// (<30 non-zero values: 0 .. maximum). Values below/above the ends take the end colours, so one extreme week/cell cannot flatten the rest.
const labv=v=>v>=1e4?Math.round(v/1e3)+'k':v>=1e3?(v/1e3).toFixed(1).replace(/\.0$/,'')+'k':v>=10?String(Math.round(v)):String(+v.toFixed(1));
function mkScale(vals){const p=vals.filter(x=>x>0).sort((x,y)=>x-y),n=p.length;if(!n)return{lo:0,hi:0,max:0};
 const q=f=>{const i=(n-1)*f,j=Math.floor(i);return p[j]+(p[Math.min(j+1,n-1)]-p[j])*(i-j)};
 let lo=0,hi=p[n-1];if(n>=30){lo=q(.05);hi=q(.98)}if(!(hi>lo)){lo=0;hi=p[n-1]}return{lo,hi,max:p[n-1]}}
const rr=(v,S)=>Math.min(Math.max(S.lin?(v-S.lo)/((S.hi-S.lo)||1):(Math.log1p(v)-Math.log1p(S.lo))/(Math.log1p(S.hi)-Math.log1p(S.lo)),0),1);
function ticks(S){if(!(S.hi>0))return'';const sp=(v,c)=>`<span class="${c}" style="left:${(100*rr(v,S)).toFixed(1)}%">${c=='e0'?'≤':c=='e1'?'≥':''}${labv(v)}</span>`;
 if(S.lin)return(sp(S.lo,'e0')+(S.hi-S.lo>=2?sp(Math.round((S.lo+S.hi)/2),''):'')+sp(S.hi,'e1')).replace(/[≤≥]/g,'');let o=S.lo>0?sp(S.lo,'e0'):'';for(let v=1;v<S.hi;v*=10){const q=100*rr(v,S);if(q>24&&q<70)o+=sp(v,'')}return o+sp(S.hi,'e1')}
const lgTip=S=>l(`Colour = hotspots per cell on a log scale, from the 5th percentile (≤${labv(S.lo)}) to the 98th percentile (≥${labv(S.hi)}) of the non-zero values in view; the highest value is ${labv(S.max)}. Relative to the current selection, so not comparable between views.`,`Renk = hücre başına sıcak nokta sayısı (log ölçek); görünümdeki sıfırdan farklı değerlerin %5'inden (≤${labv(S.lo)}) %98'ine (≥${labv(S.hi)}) kadar. En yüksek değer ${labv(S.max)}. Seçime göre göreli olduğundan görünümler arasında karşılaştırılamaz.`);
function updLegend(S){const e=document.getElementById('lt'),g=document.getElementById('lgd');if(e)e.innerHTML=ticks(S);if(g)g.title=S.hi>0?lgTip(S):''}
const MLG=L.control({position:'bottomleft'});
MLG.onAdd=()=>{const d=L.DomUtil.create('div','mlg');d.hidden=true;L.DomEvent.disableClickPropagation(d);return d};
function updMapLegend(S,cap){const d=MLG.getContainer();if(!d)return;if(!(S.hi>0)){d.hidden=true;return}d.hidden=false;
 d.innerHTML=`<small>${cap}</small><div class="lgw"><div class="lg"></div><div class="lt">${ticks(S)}</div></div>`;d.title=S.lin?'':lgTip(S)}
// text colour on a cell: whichever of near-black / white has the higher WCAG contrast with the cell colour
const lum=c=>c.map(x=>{x/=255;return x<=.03928?x/12.92:((x+.055)/1.055)**2.4}).reduce((s,x,j)=>s+x*[.2126,.7152,.0722][j],0);
function cc(v,S){if(!(v>0)||!(S.hi>0))return['#211c19','#6f665e'];const r=rr(v,S)*4,i=Math.min(Math.floor(r),3),f=r-i,c=RP[i].map((x,j)=>Math.round(x+(RP[i+1][j]-x)*f));return[`rgb(${c})`,lum(c)>.19?'#111':'#fff']}
const med=a=>{const s=[...a].sort((x,y)=>x-y),n=s.length;return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):0};
const q=(a,p)=>{const s=[...a].sort((x,y)=>x-y);return s.length?s[Math.min(s.length-1,Math.floor(p*s.length))]:0};
const dt=(y,w,e)=>new Date(Date.UTC(y,0,1+7*w+(e?(w==51?Math.round((Date.UTC(y,11,31)-Date.UTC(y,0,1+7*w))/864e5):6):0))),fd=d=>d.getUTCDate()+' '+MN[LANG][d.getUTCMonth()];
const wr=(y,w)=>{const a=dt(y,w),b=dt(y,w,1);return a.getUTCMonth()==b.getUTCMonth()?`${a.getUTCDate()}–${fd(b)}`:`${fd(a)} – ${fd(b)}`};
const mean=a=>a.reduce((p,c)=>p+c,0)/(a.length||1),sd=(a,m)=>Math.sqrt(a.reduce((p,c)=>p+(c-m)**2,0)/Math.max(a.length-1,1));
const rng=a=>{const o=[];for(let i=0;i<a.length;){let j=i;while(a[j+1]==a[j]+1)j++;o.push(j>i?`${a[i]+1}–${a[j]+1}`:`${a[i]+1}`);i=j+1}return o.join(', ')||'–'};
const rng0=a=>{const o=[];for(let i=0;i<a.length;){let j=i;while(a[j+1]==a[j]+1)j++;o.push(j>i?`${a[i]}–${a[j]}`:`${a[i]}`);i=j+1}return o.join(', ')||'–'};
const fmt=x=>Math.round(x).toLocaleString(LANG=='tr'?'tr-TR':'en-US');
const PR=[
  ['Preset area…','Hazır bölge…',null],
  ['Mediterranean coast','Akdeniz kıyısı',[36,37.5,28,36.5]],
  ['Aegean','Ege',[36.5,40,26,29.5]],
  ['Southeast Anatolia','Güneydoğu Anadolu',[36.5,38.5,37,44.5]],
